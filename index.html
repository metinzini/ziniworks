<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to the ziniworks.fun!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --bg2: #111118;
  --bg3: #18181f;
  --surface: #1e1e28;
  --surface2: #252530;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.15);
  --text: #f0f0f5;
  --text2: #a0a0b0;
  --text3: #606070;
  --accent: #7c6fff;
  --accent2: #a78bfa;
  --accent-glow: rgba(124,111,255,0.2);
  --grad1: linear-gradient(135deg, #0a0a0f 0%, #13101f 50%, #0a0f1f 100%);
  --grad-slider: linear-gradient(135deg, #0d0d15 0%, #1a1025 100%);
  --nav-height: 64px;
  --radius: 12px;
  --radius-sm: 8px;
}
[data-theme="light"] {
  --bg: #f8f8fc;
  --bg2: #ffffff;
  --bg3: #f0f0f8;
  --surface: #ffffff;
  --surface2: #f5f5fa;
  --border: rgba(0,0,0,0.08);
  --border2: rgba(0,0,0,0.15);
  --text: #111118;
  --text2: #555566;
  --text3: #9090a0;
  --accent: #5b4ef8;
  --accent2: #7c6fff;
  --accent-glow: rgba(91,78,248,0.12);
  --grad1: linear-gradient(135deg, #f0efff 0%, #faf5ff 50%, #eff5ff 100%);
  --grad-slider: linear-gradient(135deg, #1a1025 0%, #0d0d22 100%);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  min-height:100vh;
  transition:background 0.3s,color 0.3s;
}

/* NAV */
nav{
  position:fixed;top:0;left:0;right:0;
  height:var(--nav-height);
  background:rgba(10,10,15,0.85);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  z-index:1000;
  transition:background 0.3s;
}
[data-theme="light"] nav{background:rgba(248,248,252,0.9);}
.nav-inner{
  max-width:1200px;margin:0 auto;
  height:100%;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;
}
.nav-logo{
  font-family:'Playfair Display',serif;
  font-size:17px;font-weight:600;
  color:var(--text);
  text-decoration:none;
  letter-spacing:-0.3px;
  white-space:nowrap;
}
.nav-right{display:flex;align-items:center;gap:8px;}
.nav-btn{
  padding:6px 14px;
  border-radius:20px;
  border:1px solid var(--border2);
  background:transparent;
  color:var(--text2);
  font-size:13px;font-weight:500;
  cursor:pointer;
  transition:all 0.2s;
  font-family:'DM Sans',sans-serif;
}
.nav-btn:hover,.nav-btn.active{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}
.theme-btn{
  width:36px;height:36px;
  border-radius:50%;
  border:1px solid var(--border2);
  background:transparent;
  color:var(--text2);
  font-size:16px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;
}
.theme-btn:hover{background:var(--surface2);color:var(--text);}

/* SLIDER */
.slider-section{
  margin-top:var(--nav-height);
  height:90vh;
  min-height:500px;
  position:relative;
  overflow:hidden;
  background:var(--grad-slider);
}
.slide{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  padding:40px 24px;
  opacity:0;
  transition:opacity 0.8s ease;
  pointer-events:none;
}
.slide.active{opacity:1;pointer-events:auto;}
.slide-bg{
  position:absolute;inset:0;
  background:var(--grad-slider);
}
.slide-noise{
  position:absolute;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  opacity:0.4;
}
.slide-content{
  position:relative;z-index:2;
  max-width:800px;text-align:center;
  cursor:pointer;
}
.slide-tag{
  display:inline-block;
  padding:5px 14px;
  border:1px solid rgba(255,255,255,0.2);
  border-radius:20px;
  font-size:12px;font-weight:500;
  color:rgba(255,255,255,0.6);
  letter-spacing:1px;
  text-transform:uppercase;
  margin-bottom:24px;
}
.slide-hook{
  font-family:'Playfair Display',serif;
  font-size:clamp(32px,6vw,68px);
  font-weight:600;
  color:#fff;
  line-height:1.15;
  margin-bottom:20px;
  letter-spacing:-1px;
}
.slide-desc{
  font-size:16px;color:rgba(255,255,255,0.55);
  max-width:520px;margin:0 auto 32px;
}
.slide-read{
  display:inline-flex;align-items:center;gap:8px;
  padding:12px 28px;
  background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:24px;
  color:#fff;font-size:14px;font-weight:500;
  text-decoration:none;
  transition:all 0.3s;
  cursor:pointer;
  font-family:'DM Sans',sans-serif;
}
.slide-read:hover{background:rgba(255,255,255,0.2);}
.slide-empty{
  font-family:'Playfair Display',serif;
  font-size:clamp(24px,4vw,48px);
  color:rgba(255,255,255,0.3);
}

/* SLIDER DOTS */
.slider-dots{
  position:absolute;bottom:28px;left:50%;transform:translateX(-50%);
  display:flex;gap:8px;z-index:10;
}
.dot{
  width:6px;height:6px;
  border-radius:50%;
  background:rgba(255,255,255,0.3);
  cursor:pointer;transition:all 0.3s;
}
.dot.active{background:#fff;width:24px;border-radius:3px;}

/* SLIDER NAV ARROWS */
.slider-arrow{
  position:absolute;top:50%;transform:translateY(-50%);
  z-index:10;
  width:44px;height:44px;
  border-radius:50%;
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.2);
  color:#fff;font-size:18px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all 0.2s;
  user-select:none;
}
.slider-arrow:hover{background:rgba(255,255,255,0.2);}
.slider-arrow.prev{left:24px;}
.slider-arrow.next{right:24px;}

/* BLOG GRID */
.blog-section{
  max-width:1200px;margin:0 auto;
  padding:80px 24px;
}
.section-label{
  font-size:12px;font-weight:600;
  color:var(--accent2);
  letter-spacing:2px;text-transform:uppercase;
  margin-bottom:12px;
}
.section-title{
  font-family:'Playfair Display',serif;
  font-size:clamp(28px,4vw,44px);
  font-weight:600;color:var(--text);
  margin-bottom:48px;
  letter-spacing:-0.5px;
}
.blog-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
  gap:24px;
}
.blog-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  cursor:pointer;
  transition:all 0.3s;
  display:flex;flex-direction:column;
}
.blog-card:hover{
  transform:translateY(-4px);
  border-color:var(--border2);
  box-shadow:0 20px 60px rgba(0,0,0,0.3);
}
[data-theme="light"] .blog-card:hover{box-shadow:0 20px 60px rgba(0,0,0,0.1);}
.card-header{
  padding:28px 28px 0;
}
.card-tag{
  display:inline-block;
  padding:4px 12px;
  border-radius:20px;
  font-size:11px;font-weight:600;
  letter-spacing:0.5px;text-transform:uppercase;
  background:var(--accent-glow);
  color:var(--accent2);
  margin-bottom:16px;
}
.card-title{
  font-family:'Playfair Display',serif;
  font-size:22px;font-weight:600;
  color:var(--text);
  line-height:1.3;
  margin-bottom:12px;
}
.card-body{padding:12px 28px 28px;}
.card-excerpt{
  font-size:14px;color:var(--text2);
  line-height:1.7;margin-bottom:20px;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.card-footer{
  display:flex;align-items:center;justify-content:space-between;
  padding-top:16px;
  border-top:1px solid var(--border);
}
.card-date{font-size:12px;color:var(--text3);}
.card-read{
  font-size:13px;font-weight:500;color:var(--accent2);
  display:flex;align-items:center;gap:4px;
}

/* FOOTER */
footer{
  border-top:1px solid var(--border);
  padding:32px 24px;
  text-align:center;
  color:var(--text3);
  font-size:13px;
}

/* BLOG POST PAGE */
.post-page{display:none;}
.post-page.visible{display:block;}
.main-page{display:block;}
.main-page.hidden{display:none;}

.post-nav{
  position:fixed;top:0;left:0;right:0;
  height:var(--nav-height);
  background:rgba(10,10,15,0.85);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  z-index:1000;
  display:none;
}
[data-theme="light"] .post-nav{background:rgba(248,248,252,0.9);}
.post-nav.visible{display:block;}
.post-nav-inner{
  max-width:800px;margin:0 auto;height:100%;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;
}
.post-container{
  max-width:780px;margin:0 auto;
  padding:calc(var(--nav-height) + 60px) 24px 80px;
}
.post-tag{
  display:inline-block;padding:5px 14px;
  border-radius:20px;border:1px solid var(--border2);
  font-size:12px;font-weight:500;color:var(--text3);
  margin-bottom:20px;
}
.post-title{
  font-family:'Playfair Display',serif;
  font-size:clamp(28px,5vw,52px);
  font-weight:600;color:var(--text);
  line-height:1.2;margin-bottom:20px;
  letter-spacing:-0.5px;
}
.post-meta{
  display:flex;align-items:center;gap:20px;
  font-size:13px;color:var(--text3);
  padding:16px 0;
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  margin-bottom:40px;
}
.post-body{
  font-size:17px;line-height:1.85;color:var(--text2);
}
.post-body h2{
  font-family:'Playfair Display',serif;
  font-size:26px;color:var(--text);
  margin:2.5em 0 0.8em;font-weight:600;
}
.post-body h3{font-size:20px;color:var(--text);margin:2em 0 0.6em;font-weight:500;}
.post-body p{margin-bottom:1.5em;}
.post-body pre{
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:20px;margin:2em 0;
  overflow-x:auto;
}
.post-body code{
  font-family:'SF Mono','Fira Code',monospace;
  font-size:14px;color:var(--accent2);
  background:var(--surface2);
  padding:2px 6px;border-radius:4px;
}
.post-body pre code{background:none;padding:0;font-size:14px;}
.post-body strong{color:var(--text);font-weight:600;}
.post-body hr{border:none;border-top:1px solid var(--border);margin:3em 0;}
.post-bottom{
  margin-top:60px;padding-top:40px;
  border-top:1px solid var(--border);
  display:flex;justify-content:center;
}
.back-btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:13px 28px;
  background:var(--surface);
  border:1px solid var(--border2);
  border-radius:24px;
  color:var(--text);font-size:14px;font-weight:500;
  cursor:pointer;transition:all 0.2s;
  font-family:'DM Sans',sans-serif;
}
.back-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff;}

/* ADMIN MODAL */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(8px);
  z-index:2000;
  display:none;align-items:center;justify-content:center;
}
.modal-overlay.open{display:flex;}
.modal-box{
  background:var(--bg2);
  border:1px solid var(--border2);
  border-radius:var(--radius);
  padding:40px;
  width:100%;max-width:420px;
  box-shadow:0 40px 120px rgba(0,0,0,0.6);
}
.modal-title{
  font-family:'Playfair Display',serif;
  font-size:26px;font-weight:600;
  margin-bottom:8px;color:var(--text);
}
.modal-sub{font-size:14px;color:var(--text3);margin-bottom:28px;}
.modal-input{
  width:100%;padding:12px 16px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  color:var(--text);font-size:15px;
  font-family:'DM Sans',sans-serif;
  outline:none;
  transition:border 0.2s;
}
.modal-input:focus{border-color:var(--accent);}
.modal-error{font-size:13px;color:#f06060;margin-top:8px;min-height:18px;}
.modal-actions{display:flex;gap:10px;margin-top:20px;}
.btn-primary{
  flex:1;padding:12px;
  background:var(--accent);border:none;border-radius:var(--radius-sm);
  color:#fff;font-size:14px;font-weight:600;
  cursor:pointer;font-family:'DM Sans',sans-serif;
  transition:opacity 0.2s;
}
.btn-primary:hover{opacity:0.85;}
.btn-ghost{
  padding:12px 18px;
  background:transparent;
  border:1px solid var(--border);border-radius:var(--radius-sm);
  color:var(--text2);font-size:14px;cursor:pointer;
  font-family:'DM Sans',sans-serif;transition:all 0.2s;
}
.btn-ghost:hover{border-color:var(--border2);}

/* ADMIN PANEL */
.admin-panel{
  position:fixed;inset:0;
  background:var(--bg);
  z-index:3000;
  overflow-y:auto;
  display:none;
}
.admin-panel.open{display:block;}
.admin-header{
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  padding:20px 32px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:1;
}
.admin-title{
  font-family:'Playfair Display',serif;
  font-size:22px;font-weight:600;color:var(--text);
}
.admin-body{max-width:900px;margin:0 auto;padding:40px 32px;}
.admin-section{margin-bottom:48px;}
.admin-section-title{
  font-size:12px;font-weight:600;
  color:var(--accent2);letter-spacing:2px;text-transform:uppercase;
  margin-bottom:16px;padding-bottom:12px;
  border-bottom:1px solid var(--border);
}
.form-row{margin-bottom:16px;}
.form-label{
  display:block;font-size:13px;font-weight:500;
  color:var(--text2);margin-bottom:8px;
}
.form-input,.form-textarea,.form-select{
  width:100%;padding:11px 14px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  color:var(--text);font-size:14px;
  font-family:'DM Sans',sans-serif;
  outline:none;transition:border 0.2s;
  resize:vertical;
}
.form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--accent);}
.form-select option{background:var(--bg2);}

/* TOOLBAR */
.toolbar{
  display:flex;gap:4px;flex-wrap:wrap;
  background:var(--surface);
  border:1px solid var(--border);
  border-bottom:none;
  border-radius:var(--radius-sm) var(--radius-sm) 0 0;
  padding:8px 10px;
}
.tb-btn{
  padding:5px 10px;
  background:transparent;
  border:1px solid var(--border);
  border-radius:5px;
  color:var(--text2);font-size:13px;font-weight:500;
  cursor:pointer;transition:all 0.15s;
  font-family:'SF Mono','Fira Code',monospace;
  font-size:12px;
}
.tb-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff;}
#post-content{
  border-radius:0 0 var(--radius-sm) var(--radius-sm) !important;
  min-height:200px;
}

/* POST LIST (admin) */
.post-list{display:flex;flex-direction:column;gap:12px;}
.post-item{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:16px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.post-item-title{font-size:15px;font-weight:500;color:var(--text);}
.post-item-date{font-size:12px;color:var(--text3);}
.post-delete{
  padding:7px 14px;
  background:transparent;
  border:1px solid rgba(240,96,96,0.3);
  border-radius:var(--radius-sm);
  color:#f06060;font-size:13px;cursor:pointer;
  transition:all 0.2s;white-space:nowrap;
  font-family:'DM Sans',sans-serif;
}
.post-delete:hover{background:rgba(240,96,96,0.15);}

/* EMPTY STATE */
.empty-state{
  text-align:center;padding:60px 20px;
  color:var(--text3);font-size:15px;
}
.empty-icon{font-size:40px;margin-bottom:16px;opacity:0.3;}

/* ANNOUNCE TOAST */
.toast{
  position:fixed;bottom:24px;right:24px;
  background:var(--surface);
  border:1px solid var(--border2);
  border-radius:var(--radius-sm);
  padding:14px 20px;
  font-size:14px;color:var(--text);
  box-shadow:0 8px 30px rgba(0,0,0,0.3);
  z-index:9999;
  transform:translateY(20px);opacity:0;
  transition:all 0.3s;
  pointer-events:none;
}
.toast.show{transform:translateY(0);opacity:1;}

/* SLIDER ACCENT LINES */
.slide::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  opacity:0.6;
  z-index:3;
}

@media(max-width:600px){
  .blog-grid{grid-template-columns:1fr;}
  .nav-logo{font-size:14px;}
  .admin-body{padding:24px 16px;}
}
</style>
</head>
<body>

<!-- MAIN NAV -->
<nav id="main-nav">
  <div class="nav-inner">
    <a class="nav-logo" href="#" onclick="showMain()">Welcome to the ziniworks.fun!</a>
    <div class="nav-right">
      <button class="nav-btn active" id="btn-tr" onclick="setLang('tr')">TR</button>
      <button class="nav-btn" id="btn-en" onclick="setLang('en')">EN</button>
      <button class="theme-btn" id="theme-toggle" onclick="toggleTheme()" title="Tema değiştir">🌙</button>
    </div>
  </div>
</nav>

<!-- POST NAV -->
<nav class="post-nav" id="post-nav">
  <div class="post-nav-inner">
    <a class="nav-logo" href="#" onclick="showMain()">Welcome to the ziniworks.fun!</a>
    <div class="nav-right">
      <button class="nav-btn active" id="pnav-btn-tr" onclick="setLang('tr')">TR</button>
      <button class="nav-btn" id="pnav-btn-en" onclick="setLang('en')">EN</button>
      <button class="theme-btn" onclick="toggleTheme()">🌙</button>
    </div>
  </div>
</nav>

<!-- MAIN PAGE -->
<div class="main-page" id="main-page">

  <!-- SLIDER -->
  <section class="slider-section" id="slider">
    <div id="slides-container"></div>
    <button class="slider-arrow prev" onclick="prevSlide()">&#8592;</button>
    <button class="slider-arrow next" onclick="nextSlide()">&#8594;</button>
    <div class="slider-dots" id="slider-dots"></div>
  </section>

  <!-- BLOG -->
  <section class="blog-section" id="blog-section">
    <div class="section-label" data-i18n="recentPosts"></div>
    <h2 class="section-title" data-i18n="latestWritings"></h2>
    <div class="blog-grid" id="blog-grid"></div>
  </section>

  <footer>
    <span data-i18n="footerText"></span>
  </footer>
</div>

<!-- POST PAGE -->
<div class="post-page" id="post-page">
  <div class="post-container">
    <div id="post-content-display"></div>
    <div class="post-bottom">
      <button class="back-btn" onclick="showMain()">← <span data-i18n="backHome"></span></button>
    </div>
  </div>
</div>

<!-- PASSWORD MODAL -->
<div class="modal-overlay" id="pw-modal">
  <div class="modal-box">
    <div class="modal-title">Admin Panel</div>
    <div class="modal-sub" data-i18n="adminDesc"></div>
    <input class="modal-input" type="password" id="pw-input" placeholder="••••••••••" onkeydown="if(event.key==='Enter')checkPw()">
    <div class="modal-error" id="pw-error"></div>
    <div class="modal-actions">
      <button class="btn-primary" onclick="checkPw()">Giriş</button>
      <button class="btn-ghost" onclick="closePwModal()">İptal</button>
    </div>
  </div>
</div>

<!-- ADMIN PANEL -->
<div class="admin-panel" id="admin-panel">
  <div class="admin-header">
    <div class="admin-title">⚡ Admin Panel</div>
    <button class="btn-ghost" onclick="closeAdmin()">✕ Kapat</button>
  </div>
  <div class="admin-body">

    <div class="admin-section">
      <div class="admin-section-title">Yeni Yazı Ekle</div>
      <div class="form-row">
        <label class="form-label">Başlık *</label>
        <input class="form-input" id="post-title" type="text" placeholder="Yazının başlığı...">
      </div>
      <div class="form-row">
        <label class="form-label">Hook / Slayt özeti (Slider'da görünür)</label>
        <input class="form-input" id="post-hook" type="text" placeholder="Kısa, dikkat çekici bir cümle...">
      </div>
      <div class="form-row">
        <label class="form-label">Kategori</label>
        <input class="form-input" id="post-tag" type="text" placeholder="Yazılım, Tasarım, Düşünce...">
      </div>
      <div class="form-row">
        <label class="form-label">Slider Arka Plan Rengi</label>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <label style="font-size:13px;color:var(--text3);">Gölge 1:</label>
          <input type="color" id="slider-color1" value="#0d0d15" style="width:40px;height:32px;border-radius:4px;border:1px solid var(--border);background:transparent;cursor:pointer;">
          <label style="font-size:13px;color:var(--text3);">Gölge 2:</label>
          <input type="color" id="slider-color2" value="#1a1025" style="width:40px;height:32px;border-radius:4px;border:1px solid var(--border);background:transparent;cursor:pointer;">
          <label style="font-size:13px;color:var(--text3);">Yazı rengi:</label>
          <select id="slider-text-color" class="form-select" style="width:auto;padding:6px 10px;">
            <option value="#ffffff">Beyaz</option>
            <option value="#f0f0f5">Krem beyaz</option>
            <option value="#a78bfa">Mor</option>
            <option value="#67e8f9">Cyan</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <label class="form-label">İçerik</label>
        <div class="toolbar">
          <button class="tb-btn" onclick="insertTag('**','**')" title="Kalın">B</button>
          <button class="tb-btn" onclick="insertTag('## ','','heading')" title="Başlık">H2</button>
          <button class="tb-btn" onclick="insertTag('### ','','heading')" title="Alt Başlık">H3</button>
          <button class="tb-btn" onclick="insertTag('\n```\n','\n```')" title="Kod Bloğu">{ }</button>
          <button class="tb-btn" onclick="insertTag('`','`')" title="Satır içi kod">`x`</button>
          <button class="tb-btn" onclick="insertTag('\n---\n','','line')" title="Çizgi">—</button>
          <button class="tb-btn" onclick="insertTag('','','newline')" title="Paragraf">¶</button>
        </div>
        <textarea class="form-textarea form-input" id="post-content" rows="10" placeholder="Yazının tam içeriği...&#10;&#10;**kalın** yazmak için çift yıldız kullanın.&#10;&#10;## Başlık için ## kullanın.&#10;&#10;```&#10;kod bloğu buraya&#10;```"></textarea>
      </div>
      <button class="btn-primary" style="min-width:160px;" onclick="publishPost()">✓ Yayınla</button>
    </div>

    <div class="admin-section">
      <div class="admin-section-title">Mevcut Yazılar</div>
      <div class="post-list" id="admin-post-list"></div>
    </div>

  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ─── STATE ───────────────────────────────────────────────
const ADMIN_PW = '356390aaaA';
let posts = JSON.parse(localStorage.getItem('zw_posts') || '[]');
let currentSlide = 0;
let sliderTimer = null;
let currentLang = 'tr';
let isTranslating = false;

// ─── I18N ─────────────────────────────────────────────────
const i18n = {
  tr: {
    recentPosts: 'Son Yazılar',
    latestWritings: 'En Son Yazılanlar',
    backHome: 'Ana Sayfaya Dön',
    footerText: '© 2025 ziniworks.fun · Tüm haklar saklıdır.',
    adminDesc: 'Devam etmek için şifrenizi girin.',
    readMore: 'Oku →',
    readPost: 'Yazıyı Oku →',
    noPosts: 'Henüz yazı yok.',
    published: 'Yayınlandı!',
    deleted: 'Yazı silindi.',
    translating: 'Çevriliyor...',
  },
  en: {
    recentPosts: 'Recent Posts',
    latestWritings: 'Latest Writings',
    backHome: 'Back to Home',
    footerText: '© 2025 ziniworks.fun · All rights reserved.',
    adminDesc: 'Enter your password to continue.',
    readMore: 'Read →',
    readPost: 'Read Post →',
    noPosts: 'No posts yet.',
    published: 'Published!',
    deleted: 'Post deleted.',
    translating: 'Translating...',
  }
};

function t(key) { return i18n[currentLang][key] || key; }

function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  document.getElementById('btn-tr').classList.toggle('active', currentLang === 'tr');
  document.getElementById('btn-en').classList.toggle('active', currentLang === 'en');
  document.getElementById('pnav-btn-tr').classList.toggle('active', currentLang === 'tr');
  document.getElementById('pnav-btn-en').classList.toggle('active', currentLang === 'en');
}

// ─── TRANSLATION VIA CLAUDE API ─────────────────────────
async function translateText(text) {
  if (!text) return text;
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{
          role: 'user',
          content: `Translate the following Turkish text to English. Return ONLY the translation, nothing else, no explanation:\n\n${text}`
        }]
      })
    });
    const data = await res.json();
    return data.content?.[0]?.text?.trim() || text;
  } catch { return text; }
}

async function setLang(lang) {
  if (lang === currentLang) return;
  currentLang = lang;
  applyI18n();
  renderBlogGrid();
  renderSlider();
  localStorage.setItem('zw_lang', lang);
}

// ─── THEME ───────────────────────────────────────────────
function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('theme-toggle').textContent = isDark ? '☀️' : '🌙';
  localStorage.setItem('zw_theme', isDark ? 'light' : 'dark');
}

// ─── SAVE / LOAD POSTS ──────────────────────────────────
function savePosts() { localStorage.setItem('zw_posts', JSON.stringify(posts)); }

// ─── PUBLISH POST ────────────────────────────────────────
async function publishPost() {
  const title = document.getElementById('post-title').value.trim();
  const hook = document.getElementById('post-hook').value.trim();
  const tag = document.getElementById('post-tag').value.trim() || 'Genel';
  const content = document.getElementById('post-content').value.trim();
  const c1 = document.getElementById('slider-color1').value;
  const c2 = document.getElementById('slider-color2').value;
  const tc = document.getElementById('slider-text-color').value;

  if (!title || !content) { showToast('Başlık ve içerik zorunlu.'); return; }

  const post = {
    id: Date.now(),
    title, hook, tag, content,
    sliderColor1: c1, sliderColor2: c2, sliderTextColor: tc,
    date: new Date().toLocaleDateString('tr-TR', { day:'numeric', month:'long', year:'numeric' })
  };
  posts.unshift(post);
  savePosts();

  // reset form
  ['post-title','post-hook','post-tag','post-content'].forEach(id => document.getElementById(id).value = '');

  showToast(t('published'));
  renderAdminList();
  renderBlogGrid();
  renderSlider();
}

// ─── DELETE POST ─────────────────────────────────────────
function deletePost(id) {
  if (!confirm('Bu yazıyı silmek istediğinize emin misiniz?')) return;
  posts = posts.filter(p => p.id !== id);
  savePosts();
  renderAdminList();
  renderBlogGrid();
  renderSlider();
  showToast(t('deleted'));
}

// ─── RENDER BLOG GRID ────────────────────────────────────
async function renderBlogGrid() {
  const grid = document.getElementById('blog-grid');
  if (!posts.length) {
    grid.innerHTML = `<div class="empty-state"><div class="empty-icon">✦</div>${t('noPosts')}</div>`;
    return;
  }
  let displayPosts = posts;
  if (currentLang === 'en') {
    displayPosts = await Promise.all(posts.map(async p => ({
      ...p,
      _title: await translateText(p.title),
      _hook: p.hook ? await translateText(p.hook) : '',
      _tag: await translateText(p.tag),
      _excerpt: await translateText(getExcerpt(p.content))
    })));
  }
  grid.innerHTML = displayPosts.map((p, i) => {
    const orig = posts[i];
    const title = currentLang === 'en' ? (p._title || p.title) : p.title;
    const tag = currentLang === 'en' ? (p._tag || p.tag) : p.tag;
    const excerpt = currentLang === 'en' ? (p._excerpt || getExcerpt(p.content)) : getExcerpt(p.content);
    return `<div class="blog-card" onclick="openPost(${orig.id})">
      <div class="card-header">
        <div class="card-tag">${tag}</div>
        <div class="card-title">${title}</div>
      </div>
      <div class="card-body">
        <div class="card-excerpt">${excerpt}</div>
        <div class="card-footer">
          <span class="card-date">${orig.date}</span>
          <span class="card-read">${t('readMore')}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function getExcerpt(content, len = 160) {
  return content.replace(/\*\*(.*?)\*\*/g, '$1').replace(/#{1,3} /g, '').replace(/```[\s\S]*?```/g, '[kod]').replace(/`/g,'').substring(0, len) + (content.length > len ? '...' : '');
}

// ─── RENDER SLIDER ───────────────────────────────────────
async function renderSlider() {
  const container = document.getElementById('slides-container');
  const dotsEl = document.getElementById('slider-dots');

  if (!posts.length) {
    container.innerHTML = `<div class="slide active"><div class="slide-bg"></div><div class="slide-noise"></div><div class="slide-content"><div class="slide-empty">✦</div></div></div>`;
    dotsEl.innerHTML = '';
    return;
  }

  const sliderPosts = posts.slice(0, 5);
  let displayData = sliderPosts;
  if (currentLang === 'en') {
    displayData = await Promise.all(sliderPosts.map(async p => ({
      ...p,
      _hook: p.hook ? await translateText(p.hook) : '',
      _title: await translateText(p.title)
    })));
  }

  container.innerHTML = displayData.map((p, i) => {
    const orig = sliderPosts[i];
    const hook = currentLang === 'en' ? (p._hook || p.hook || p._title || p.title) : (p.hook || p.title);
    const title = currentLang === 'en' ? (p._title || p.title) : p.title;
    const tc = orig.sliderTextColor || '#ffffff';
    const c1 = orig.sliderColor1 || '#0d0d15';
    const c2 = orig.sliderColor2 || '#1a1025';
    return `<div class="slide${i===0?' active':''}" id="slide-${i}">
      <div class="slide-bg" style="background:linear-gradient(135deg,${c1} 0%,${c2} 100%);"></div>
      <div class="slide-noise"></div>
      <div class="slide-content" onclick="openPost(${orig.id})" style="cursor:pointer;">
        <div class="slide-tag">${orig.tag}</div>
        <div class="slide-hook" style="color:${tc};">${hook}</div>
        <div class="slide-desc" style="color:${tc === '#ffffff' ? 'rgba(255,255,255,0.55)' : tc + '99'};">${title !== hook ? title : ''}</div>
        <span class="slide-read">${t('readPost')}</span>
      </div>
    </div>`;
  }).join('');

  dotsEl.innerHTML = sliderPosts.map((_, i) =>
    `<div class="dot${i===0?' active':''}" onclick="goToSlide(${i})"></div>`
  ).join('');

  currentSlide = 0;
  startSliderTimer();
}

function goToSlide(n) {
  const slides = document.querySelectorAll('.slide');
  const dots = document.querySelectorAll('.dot');
  if (!slides.length) return;
  slides.forEach(s => s.classList.remove('active'));
  dots.forEach(d => d.classList.remove('active'));
  currentSlide = (n + slides.length) % slides.length;
  slides[currentSlide].classList.add('active');
  if (dots[currentSlide]) dots[currentSlide].classList.add('active');
}

function nextSlide() { goToSlide(currentSlide + 1); }
function prevSlide() { goToSlide(currentSlide - 1); }

function startSliderTimer() {
  clearInterval(sliderTimer);
  sliderTimer = setInterval(() => nextSlide(), 5000);
}

// ─── OPEN POST ───────────────────────────────────────────
async function openPost(id) {
  const post = posts.find(p => p.id === id);
  if (!post) return;

  let title = post.title, tag = post.tag, content = post.content;
  if (currentLang === 'en') {
    [title, tag, content] = await Promise.all([
      translateText(post.title),
      translateText(post.tag),
      translateText(post.content)
    ]);
  }

  const html = `
    <div class="post-tag">${tag}</div>
    <h1 class="post-title">${title}</h1>
    <div class="post-meta">
      <span>${post.date}</span>
    </div>
    <div class="post-body">${parseContent(content)}</div>`;

  document.getElementById('post-content-display').innerHTML = html;
  document.getElementById('main-page').classList.add('hidden');
  document.getElementById('post-page').classList.add('visible');
  document.getElementById('main-nav').style.display = 'none';
  document.getElementById('post-nav').classList.add('visible');
  window.scrollTo(0, 0);
}

function parseContent(text) {
  return text
    .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^---$/gm, '<hr>')
    .split(/\n{2,}/)
    .map(p => p.trim())
    .filter(p => p)
    .map(p => /^<[h|p|c|s]/.test(p) ? p : `<p>${p.replace(/\n/g,'<br>')}</p>`)
    .join('');
}

function showMain() {
  document.getElementById('main-page').classList.remove('hidden');
  document.getElementById('post-page').classList.remove('visible');
  document.getElementById('main-nav').style.display = '';
  document.getElementById('post-nav').classList.remove('visible');
  window.scrollTo(0, 0);
}

// ─── ADMIN ───────────────────────────────────────────────
function openPwModal() {
  document.getElementById('pw-modal').classList.add('open');
  setTimeout(() => document.getElementById('pw-input').focus(), 100);
}
function closePwModal() {
  document.getElementById('pw-modal').classList.remove('open');
  document.getElementById('pw-input').value = '';
  document.getElementById('pw-error').textContent = '';
}
function checkPw() {
  const val = document.getElementById('pw-input').value;
  if (val === ADMIN_PW) {
    closePwModal();
    openAdmin();
  } else {
    document.getElementById('pw-error').textContent = 'Hatalı şifre.';
    document.getElementById('pw-input').value = '';
  }
}
function openAdmin() {
  document.getElementById('admin-panel').classList.add('open');
  renderAdminList();
}
function closeAdmin() {
  document.getElementById('admin-panel').classList.remove('open');
}
function renderAdminList() {
  const el = document.getElementById('admin-post-list');
  if (!posts.length) {
    el.innerHTML = `<div style="color:var(--text3);font-size:14px;padding:16px 0;">Henüz yazı yok.</div>`;
    return;
  }
  el.innerHTML = posts.map(p => `
    <div class="post-item">
      <div>
        <div class="post-item-title">${p.title}</div>
        <div class="post-item-date">${p.date}</div>
      </div>
      <button class="post-delete" onclick="deletePost(${p.id})">✕ Sil</button>
    </div>`).join('');
}

// ─── TOOLBAR ─────────────────────────────────────────────
function insertTag(open, close, type) {
  const ta = document.getElementById('post-content');
  const start = ta.selectionStart, end = ta.selectionEnd;
  const sel = ta.value.substring(start, end);
  let ins = '';
  if (type === 'heading') ins = open + (sel || 'Başlık');
  else if (type === 'line') ins = open;
  else if (type === 'newline') ins = '\n\n';
  else ins = open + (sel || 'metin') + close;
  ta.value = ta.value.substring(0, start) + ins + ta.value.substring(end);
  ta.focus();
  ta.selectionStart = ta.selectionEnd = start + ins.length;
}

// ─── KEYBOARD ────────────────────────────────────────────
const keys = { ctrl: false, shift: false };
document.addEventListener('keydown', e => {
  if (e.key === 'Control') keys.ctrl = true;
  if (e.key === 'Shift') keys.shift = true;
  if (keys.ctrl && keys.shift && e.key.toLowerCase() === 'a') {
    e.preventDefault();
    openPwModal();
  }
  if (e.key === 'Escape') { closePwModal(); closeAdmin(); }
});
document.addEventListener('keyup', e => {
  if (e.key === 'Control') keys.ctrl = false;
  if (e.key === 'Shift') keys.shift = false;
});

// ─── TOAST ───────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// ─── INIT ─────────────────────────────────────────────────
(function init() {
  const savedTheme = localStorage.getItem('zw_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);
  document.getElementById('theme-toggle').textContent = savedTheme === 'dark' ? '🌙' : '☀️';

  const savedLang = localStorage.getItem('zw_lang') || 'tr';
  currentLang = savedLang;
  applyI18n();
  renderBlogGrid();
  renderSlider();
})();
</script>
</body>
</html>
